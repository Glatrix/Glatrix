:root{--bg:#06080b;--card:#0a0c10;--edge:#1d222b;--text:#e9e6dc;--muted:#7d8794;--dim:#2b3442;--amber:#ffb000;--ice:#6fd3ff;--hot:#f6f4ec;--mint:#7ee8b2;--violet:#c49bff;--red:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font:14px/1.55 CM,ui-monospace,Consolas,Menlo,monospace;display:flex;justify-content:center;padding:22px 12px;
  background:radial-gradient(1200px 600px at 50% -10%,#121820 0,transparent 60%),var(--bg)}
.win{width:100%;max-width:1000px;height:calc(100vh - 44px);background:var(--card);border:1px solid var(--edge);border-radius:14px;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--edge);color:var(--muted);font-size:12.5px}
.bar .dot{width:8px;height:8px;border-radius:50%;background:#5fe08a;animation:pulse 2s ease-in-out infinite}
.bar b{color:var(--text)}.bar .sp{flex:1}.bar a{color:var(--muted);text-decoration:none}.bar a:hover{color:var(--ice)}
@keyframes pulse{50%{opacity:.25}}
#term{flex:1;overflow-y:auto;padding:16px 20px 40px;cursor:text;scrollbar-color:#2b3442 transparent}
.line{white-space:pre-wrap;word-break:break-word;min-height:1.55em}
.u{color:var(--mint)}.h{color:var(--muted)}
#in-line{display:flex}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-weight:700;padding:0;margin:0;caret-color:var(--amber)}
.muted{color:var(--muted)}.amber{color:var(--amber)}.ice{color:var(--ice)}.mint{color:var(--mint)}.hot{color:var(--hot)}.violet{color:var(--violet)}.red{color:var(--red)}.b{font-weight:700}
a{color:var(--ice)}
.grid{display:grid;grid-template-columns:max-content 1fr;gap:1px 22px;margin:2px 0 6px 2ch}
.panel{margin:8px 0 10px;max-width:900px}.panel img{width:100%;display:block;border-radius:14px}
canvas{display:block;max-width:100%;border-radius:14px;touch-action:none}
pre{margin:6px 0;font:inherit}
pre.art{line-height:1.08;font-size:13px;background:linear-gradient(90deg,var(--amber),var(--hot) 50%,var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
pre.code{color:#9fe3a8;line-height:1.45;max-height:60vh;overflow:hidden;font-size:13px}
.card{display:flex;gap:16px;align-items:center;border:1px solid var(--edge);border-radius:14px;padding:16px;max-width:560px;margin:8px 0;text-decoration:none;color:var(--text);background:#0d1016;transition:border-color .2s}
.card:hover{border-color:var(--ice)}
.card .av{position:relative;flex:none}.card .av img{width:72px;height:72px;border-radius:50%;display:block}
.card .av i{position:absolute;right:0;bottom:2px;width:18px;height:18px;border-radius:50%;border:3px solid #0d1016}
.card .nm{font-weight:700;font-size:16px}.card .sub{color:var(--muted);font-size:12.5px}
.granted{display:inline-block;margin:8px 0;padding:10px 18px;border:2px solid var(--mint);color:var(--mint);font-weight:700;letter-spacing:.2em;animation:blink .5s steps(1) 6}
@keyframes blink{50%{opacity:0}}
.hint{color:var(--muted);font-size:12px}
@media (max-width:600px){body{padding:0}.win{height:100vh;border-radius:0;border:0}#term{padding:12px}body{font-size:13px}}
</style>

// ------------------------------------------------------------- programs
function donutText(A, B, W, H) {
  const R1 = 1, R2 = 2, K2 = 5, K1 = W * K2 * 3 / (8 * (R1 + R2));
  const outc = new Array(W * H).fill(" "), zb = new Float32Array(W * H);
  const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
  for (let th = 0; th < 6.2832; th += 0.07) {
    const ct = Math.cos(th), st = Math.sin(th);
    for (let ph = 0; ph < 6.2832; ph += 0.02) {
      const cp = Math.cos(ph), sp = Math.sin(ph);
      const ox = R2 + R1 * ct, oy = R1 * st;
      const x = ox * (cB * cp + sA * sB * sp) - oy * cA * sB;
      const y = ox * (sB * cp - sA * cB * sp) + oy * cA * cB;
      const ooz = 1 / (K2 + cA * ox * sp + oy * sA);
      const xp = (W / 2 + K1 * ooz * x) | 0, yp = (H / 2 - K1 * ooz * y * 0.5) | 0;
      const L = cp * ct * sB - cA * ct * sp - sA * st + cB * (cA * st - ct * sA * sp);
      if (L > 0 && xp >= 0 && xp < W && yp >= 0 && yp < H) {
        const o = xp + W * yp;
        if (ooz > zb[o]) { zb[o] = ooz; outc[o] = ".,-~:;=!*#$@"[Math.min(11, (L * 8) | 0)]; }
      }
    }
  }
  let s = "";
  for (let r = 0; r < H; r++) s += outc.slice(r * W, r * W + W).join("") + "\n";
  return s;
}

const HACK = `// trampoline.cpp: detour a function and keep a way back
#include <windows.h>
#include <cstdint>
#include <cstring>

struct Trampoline {
    uint8_t* target;
    uint8_t* gateway;
    uint8_t  stolen[16];
    size_t   length;
};

static void write_jmp(uint8_t* at, const void* dest) {
    int32_t rel = (int32_t)((const uint8_t*)dest - (at + 5));
    at[0] = 0xE9;                         // jmp rel32
    std::memcpy(at + 1, &rel, sizeof rel);
}

bool install(Trampoline& t, void* target, void* hook, size_t length) {
    if (length < 5) return false;         // a rel32 jmp needs five bytes
    t.target = (uint8_t*)target;
    t.length = length;
    std::memcpy(t.stolen, target, length);

    // allocate within +-2GB so rel32 can reach both ways
    t.gateway = (uint8_t*)VirtualAlloc(nullptr, 64, MEM_COMMIT | MEM_RESERVE,
                                       PAGE_EXECUTE_READWRITE);
    if (!t.gateway) return false;
    std::memcpy(t.gateway, t.stolen, length);
    write_jmp(t.gateway + length, t.target + length);

    DWORD old;
    VirtualProtect(target, length, PAGE_EXECUTE_READWRITE, &old);
    write_jmp(t.target, hook);
    std::memset(t.target + 5, 0x90, length - 5);   // pad with nops
    VirtualProtect(target, length, old, &old);
    FlushInstructionCache(GetCurrentProcess(), target, length);
    return true;
}

void uninstall(Trampoline& t) {
    DWORD old;
    VirtualProtect(t.target, t.length, PAGE_EXECUTE_READWRITE, &old);
    std::memcpy(t.target, t.stolen, t.length);
    VirtualProtect(t.target, t.length, old, &old);
    VirtualFree(t.gateway, 0, MEM_RELEASE);
}

// ; and the same idea one level down, in raw x64
//   mov  [rsp+10h], rbx        ; stolen
//   jmp  qword ptr [rip+0]     ; back to target+5
//   dq   target+5

int main() {
    Trampoline t{};
    // pick a target, write a hook, call install(), draw something nice.
    return 0;
}
`;

// ------------------------------------------------------------- interactive 3D graph
function graph() {
  if (liveGraph) liveGraph.stop();
  const wrap = block(document.createElement("div"));
  wrap.className = "panel";
  const c = document.createElement("canvas"); wrap.appendChild(c);
  const hint = document.createElement("div"); hint.className = "hint";
  hint.textContent = "drag to orbit, scroll or pinch to zoom, hover a node to light up its links";
  wrap.appendChild(hint);
  const ctx = c.getContext("2d");
  const N = GRAPH.nodes, E = GRAPH.edges;
  const adj = N.map(() => new Set());
  E.forEach(([a, b]) => { adj[a].add(b); adj[b].add(a); });
  let W = 0, H = 0, yaw = 0.4, pitch = 0.23, zoom = 1, drag = null, mx = -1, my = -1, idle = 9, alive = true, last = performance.now();
  const pointers = new Map(); let pinch = 0;
  function size() {
    const dpr = window.devicePixelRatio || 1;
    W = Math.min(out.clientWidth, 900); H = Math.round(W * 0.78);
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + "px"; c.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size(); window.addEventListener("resize", size);
  c.addEventListener("pointerdown", e => {
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    c.setPointerCapture(e.pointerId);
    if (pointers.size === 1) drag = {x: e.clientX, y: e.clientY, yaw, pitch};
    idle = 0;
  });
  c.addEventListener("pointermove", e => {
    const r = c.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top;
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 2) {
      const [p, q] = [...pointers.values()], dist = Math.hypot(p[0] - q[0], p[1] - q[1]);
      if (pinch) zoom = clamp(zoom * dist / pinch, 0.5, 2.8);
      pinch = dist; drag = null;
    } else if (drag) {
      yaw = drag.yaw + (e.clientX - drag.x) * 0.008;

  function frame(now) {

    if (!drag && idle > 1.2) yaw += dt * 0.16;
    const k = W / 900 * zoom, persp = 1250, cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const P = N.map(([, , , x, y, z]) => {
      const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;

    });
    let hover = -1, best = 14;
    if (mx >= 0) P.forEach((p, i) => { const dd = Math.hypot(p.x - mx, p.y - my); if (dd < best) { best = dd; hover = i; } });
    c.style.cursor = drag ? "grabbing" : hover >= 0 ? "pointer" : "grab";
    const lit = hover >= 0 ? new Set([hover, ...adj[hover]]) : null;

    ctx.fillStyle = "#0a0c10"; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.45);
    g.addColorStop(0, "rgba(255,217,160,.13)"); g.addColorStop(.5, "rgba(111,211,255,.04)"); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    for (const [a, b, cross] of E) {
      const pa = P[a], pb = P[b];
      const on = lit && (a === hover || b === hover);
      let alpha = cross ? 0.04 + 0.4 * (pa.d + pb.d) / 2 : 0.06 + 0.5 * (pa.d + pb.d) / 2;
      if (lit) alpha = on ? 0.95 : alpha * 0.25;

      return kind === "root" ? 0 : kind === "hub" ? 1 : (name === "C#" || name === "C++" || name === "C") ? 2 : 3; };
    const cand = P.map((p, i) => i).filter(i => lit ? lit.has(i) || N[i][1] !== "leaf" || P[i].d > .62 : N[i][1] !== "leaf" || P[i].d > .45)

      const fs = (kind === "root" ? 15 : kind === "hub" ? 13.5 : 11.5) * Math.pow(p.s, 0.85) * Math.min(1.25, Math.sqrt(zoom));

}

const hist = []; let hpos = 0;
const NAMES = [...Object.keys(COMMANDS)];
function run(line) {
  print(PROMPT + '<span class="b">' + esc(line) + "</span>");
  const parts = line.trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return;
  hist.push(line.trim()); hpos = hist.length;
  const [name, ...args] = parts;
  const c = COMMANDS[name.toLowerCase()];
  try {
    if (c) c[1](args);
    else if (HIDDEN[name.toLowerCase()]) HIDDEN[name.toLowerCase()](args);
    else print(esc(name) + ': command not found. try <span class="ice">help</span>');
  } catch (e) { print('<span class="red">' + esc(e.message) + "</span>"); }
  scroll();
}
cmd.addEventListener("keydown", e => {
  if (program) return;
  if (e.key === "Enter") { const v = cmd.value; cmd.value = ""; run(v); }
  else if (e.key === "ArrowUp") { e.preventDefault(); if (hpos > 0) cmd.value = hist[--hpos]; }
  else if (e.key === "ArrowDown") { e.preventDefault(); hpos = Math.min(hist.length, hpos + 1); cmd.value = hist[hpos] || ""; }
  else if (e.key === "Tab") {
    e.preventDefault();
    const v = cmd.value.trim(), m = NAMES.filter(n => n.startsWith(v));
    if (m.length === 1) cmd.value = m[0] + " ";
    else if (m.length > 1) { print(PROMPT + esc(cmd.value)); print(m.map(n => '<span class="ice">' + n + "</span>").join("  ")); }
  }
  else if (e.ctrlKey && e.key.toLowerCase() === "l") { e.preventDefault(); out.innerHTML = ""; }
  else if (e.ctrlKey && e.key.toLowerCase() === "c" && !window.getSelection().toString()) { print(PROMPT + esc(cmd.value) + "^C"); cmd.value = ""; }
